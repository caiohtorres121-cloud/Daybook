:root{
  --fundo:#d9dee5; --bg:#fcfbf7; --ink:#1f2630; --mute:#6f7885; --line:#cfdcec; --furo:#aab4c0;
  --dia:#2f7fc1; --manha:#b97f00; --tarde:#1b8a6b; --noite:#5a5bd4; --pend:#d4435b;
  --serif:"LoraEmb",Charter,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--fundo:#0e1116; --bg:#1c2028; --ink:#e8edf3; --mute:#8d99a9; --line:#2d3644; --furo:#3a4351;
        --dia:#6db3f2; --manha:#f0b429; --tarde:#3cc79f; --noite:#8f90f5; --pend:#ff7a8e;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 16px 48px;background:var(--bg);
  box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12)}
header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
header h1{flex:1;margin:0;font:700 26px/1.15 var(--serif);text-align:center}
header small{display:block;font:400 13px/1.3 system-ui,sans-serif;color:var(--mute)}
.nav{width:44px;height:44px;border:1px solid var(--furo);background:transparent;color:var(--ink);
  border-radius:12px;font-size:20px;cursor:pointer}
.acoes{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.link{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;
  cursor:pointer;min-height:40px;padding:0 4px}
.link#datalb{position:relative;display:inline-flex;align-items:center;cursor:pointer}
#dp{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.link.forte{color:var(--ink);font-weight:600}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--tarde);transition:width .25s}

.lista{margin-bottom:14px}
.grupo h2{margin:14px 0 0;padding-bottom:2px;min-height:38px;font:700 20px/1.2 var(--serif);color:var(--c);
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.grupo h2 .nome{padding:0 5px;margin-left:-5px;box-shadow:inset 0 -.42em 0 color-mix(in srgb,var(--c) 20%,transparent)}
.grupo h2 .cont{font:400 13px/1 system-ui,sans-serif;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;padding:3px 0;min-height:42px;border-bottom:1px solid var(--line)}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;
  border:2px solid var(--c);border-radius:8px;cursor:pointer;display:grid;place-content:center}
li input[type=checkbox]:checked{background:var(--c)}
li input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);
  border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
li label,li .tit,li .txt{flex:1;min-width:0;word-break:break-word}
li label,li .tit{cursor:pointer}
li.feito label,li.feito .tit{color:var(--mute);text-decoration:line-through}
.hora{font-weight:600;font-variant-numeric:tabular-nums;color:var(--c);margin-right:8px;white-space:nowrap}
.chev{margin-left:6px;color:var(--mute);font-size:12px}
.desc{flex-basis:100%;padding:0 0 8px 34px;font-size:14px;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.origem{display:block;font-size:12px;color:var(--mute)}
.dsc{display:block;font-size:12px;color:var(--mute);white-space:pre-wrap}
li>button{flex:none;width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:19px;cursor:pointer}
.vazio{color:var(--mute);font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.livre{text-align:center;color:var(--mute);padding:36px 12px}

form{display:flex;gap:8px;margin-top:8px}
input[type=text],.ta{flex:1;min-width:0;padding:0 12px;border:1px solid var(--furo);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit}
input[type=text]{height:44px}
.ta{display:block;width:100%;padding:8px 12px;margin-top:6px;resize:vertical}
form button{height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--c);color:#fff;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){form button{color:#12161d}}
.rep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--mute);min-height:32px}
.rep input{width:20px;height:20px;margin:0;accent-color:var(--c)}
input[type=time]{height:40px;padding:0 8px;border:1px solid var(--furo);border-radius:8px;
  background:var(--bg);color:var(--ink);font:inherit}
.rep input[type=time]{width:auto;accent-color:auto}
.opcoes{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center}
.edita{display:block;padding:8px 0}
.edita form{display:flex;flex-direction:column;gap:8px;margin:0}
.edita input[type=text]{flex:none;width:100%}
.edita .ta{margin-top:0}
.hrs{display:flex;align-items:center;gap:8px;color:var(--mute)}
.hrs input[type=time]{flex:1;min-width:0}
.esc{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute)}
.esc label{display:flex;align-items:center;gap:6px;min-height:32px}
.esc input{width:18px;height:18px;margin:0;accent-color:var(--c)}
.bts{display:flex;flex-wrap:wrap;gap:8px}
.edita .bts button{width:auto;flex:none;font-size:16px}
.bts .sec{background:none;color:var(--mute);border:1px solid var(--furo)}

.aviso{margin:20px 0 0;padding-top:10px;border-top:2px dotted var(--furo);color:var(--mute)}
.aviso h2{margin:0 0 2px;font:700 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.aviso li{flex-wrap:nowrap;justify-content:space-between;gap:12px;min-height:34px;border-bottom:0}
.aviso .tag{font-size:12px;white-space:nowrap}
.hora{font-family:var(--sans);font-size:15px}
#periodos{font-family:var(--serif);font-size:17px}
#periodos button,#periodos input[type=time],#periodos .rep,#periodos .esc,#periodos .hrs,#periodos .origem,#periodos .cont,#periodos .tag{font-family:var(--sans)}
#periodos .rep,#periodos .esc{font-size:14px}
#periodos .origem,#periodos .tag{font-size:12px}
.alerta{border:1px solid var(--pend);color:var(--pend);border-radius:10px;padding:8px 12px;margin-bottom:10px;font:13px/1.35 var(--sans)}
.alerta[hidden]{display:none}
.backup{margin:24px 0 0;padding-top:10px;border-top:2px dotted var(--furo);color:var(--mute)}
.backup h2{margin:0 0 8px;font:700 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.backup button{height:40px;padding:0 14px;border:1px solid var(--furo);border-radius:10px;background:none;color:var(--ink);font-family:var(--sans);font-size:14px;cursor:pointer}
.erro{color:var(--pend);font-size:13px}
.erro:empty{display:none}
.pergunta{margin-bottom:8px}
.apaga .bts button{height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--c);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
@media (prefers-color-scheme:dark){.apaga .bts button{color:#12161d}}
.apaga .bts button.sec{background:none;color:var(--mute);border:1px solid var(--furo);font-weight:400}
.ocultas{margin:20px 0 0;padding-top:10px;border-top:2px dotted var(--furo);color:var(--mute)}
.ocultas h2{margin:0 0 2px;font:700 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.ocultas li{flex-wrap:nowrap;justify-content:space-between;gap:12px;border-bottom:0}
.ocultas li button{width:auto;height:34px;padding:0 12px;border:1px solid var(--furo);border-radius:8px;color:var(--ink);font-size:14px}
.rep input[type=number]{width:64px;height:40px;padding:0 8px;border:1px solid var(--furo);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#periodos select{height:40px;padding:0 8px;border:1px solid var(--furo);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-family:var(--sans);font-size:14px}
#periodos .rep input[type=number]{font-family:var(--sans)}
.novo{margin:4px 0 6px;padding-bottom:14px;border-bottom:2px dotted var(--furo)}
.novo form{margin-top:0}
.dica{margin-top:8px;font:12px/1.35 var(--sans);color:var(--mute)}
:focus-visible{outline:3px solid var(--noite);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <button class="nav" id="ant" aria-label="Dia anterior">‹</button>
    <h1 id="titulo"></h1>
    <button class="nav" id="prox" aria-label="Próximo dia">›</button>
  </header>
  <div class="acoes">
    <button class="link" id="hoje">Ir para hoje</button>
    <label class="link" id="datalb">Escolher data<input type="date" id="dp" aria-label="Escolher data"></label>
    <button class="link forte" id="modo">Editar tarefas</button>
  </div>
  <div class="alerta" id="alerta" hidden>Este modo de abertura não permite salvar as tarefas: o que você criar some ao fechar. Baixe o arquivo e abra-o direto no navegador (Chrome, Edge, Firefox ou Safari).</div>
  <div class="bar" id="barra" aria-hidden="true"><i id="prog"></i></div>
  <div id="periodos"></div>
</main>
<script>
const PERIODOS=[
  {id:'diarias',nome:'Diárias',cor:'var(--dia)',semHora:true},
  {id:'manha',nome:'Manhã',cor:'var(--manha)'},
  {id:'tarde',nome:'Tarde',cor:'var(--tarde)'},
  {id:'noite',nome:'Noite',cor:'var(--noite)'}
];
const porHora=a=>a.slice().sort((x,y)=>{const u=x.t.h||'99:99',v=y.t.h||'99:99';return u<v?-1:u>v?1:0});
let dados={},fixas={},mensais={};
function ler(k,def){
  let raw=null;
  try{raw=localStorage.getItem(k);if(!raw)return def;const v=JSON.parse(raw);return v&&typeof v==='object'?v:def}
  catch(e){try{if(raw)localStorage.setItem(k+'_corrompido',raw)}catch(e2){}return def}
}
function carregar(){
  dados=ler('meudia',{});fixas=ler('meudia_fixas',{});mensais=ler('meudia_mensais',{});
  PERIODOS.forEach(p=>{if(!Array.isArray(fixas[p.id]))fixas[p.id]=[];if(!Array.isArray(mensais[p.id]))mensais[p.id]=[]});
}
carregar();
function salvar(){try{localStorage.setItem('meudia',JSON.stringify(dados))}catch(e){}}
function salvarMensais(){try{localStorage.setItem('meudia_mensais',JSON.stringify(mensais))}catch(e){}}
function salvarFixas(){try{localStorage.setItem('meudia_fixas',JSON.stringify(fixas))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const chave=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const meioDia=d=>{d.setHours(12,0,0,0);return d};
let dia=meioDia(new Date());
let editando=false,editRef=null,apagando=null;
const abertas=new Set();

function dd(k){
  if(!dados[k])dados[k]={};
  PERIODOS.forEach(p=>{if(!dados[k][p.id])dados[k][p.id]=[]});
  ['fixasOk','fixasOv','fixasOcultas','mgen'].forEach(n=>{if(!dados[k][n])dados[k][n]={}});
  return dados[k];
}
function doDia(){return dd(chave(dia))}
function gerarMensais(limite){
  let mudou=false;
  PERIODOS.forEach(p=>mensais[p.id].forEach(m=>{
    let [y,mo]=m.desde.split('-').map(Number);mo-=1;
    for(;;){
      const k=y+'-'+pad(mo+1)+'-'+pad(Math.min(m.dia,new Date(y,mo+1,0).getDate()));
      if(k>limite)break;
      if(k>=m.desde&&(!m.ate||k<=m.ate)){
        const x=dd(k);
        if(!x.mgen[m.id]){x[p.id].push({t:m.t,ok:false,h:m.h||'',hf:m.hf||'',desc:m.desc||'',mid:m.id});x.mgen[m.id]=true;mudou=true}
      }
      mo++;if(mo>11){mo=0;y++}
    }
  }));
  if(mudou)salvar();
}
function pendentes(){
  const vk=chave(dia);
  const out=[];
  Object.keys(dados).sort().forEach(k=>{
    if(k>=vk)return;
    const dd=[];
    PERIODOS.forEach(p=>(dados[k][p.id]||[]).forEach(t=>{if(!t.ok)dd.push({t,ref:t,per:p.id,lista:dados[k][p.id],k})}));
    out.push(...porHora(dd));
  });
  return out;
}
function avisos(){
  const out=[];
  [[1,'amanhã'],[7,'em 7 dias']].forEach(([n,tag])=>{
    const x=new Date(dia);x.setDate(x.getDate()+n);
    const dn=dados[chave(x)];if(!dn)return;
    const arr=[];
    PERIODOS.forEach(p=>(dn[p.id]||[]).forEach(t=>{if(!t.ok)arr.push({t,tag,lista:dn[p.id]})}));
    out.push(...porHora(arr));
  });
  return out;
}
function origem(k){
  const d=meioDia(new Date(k+'T12:00:00'));
  if(Math.round((d-dia)/864e5)===-1)return 'de ontem';
  return 'de '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
}
function grupoDe(h){return !h?'diarias':h<'12:00'?'manha':h<'18:00'?'tarde':'noite'}
function itensTodos(d){const out=[];PERIODOS.forEach(p=>out.push(...itensDo(p,d)));return out}
function titulo(){
  const diff=Math.round((dia-meioDia(new Date()))/864e5);
  const rel=diff===0?'Hoje':diff===1?'Amanhã':diff===-1?'Ontem':'';
  const longa=dia.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  return rel?rel+'<small>'+longa+'</small>':longa.charAt(0).toUpperCase()+longa.slice(1);
}
function itensDo(p,d){
  const vk=chave(dia);
  const fx=fixas[p.id].filter(f=>f.desde<=vk&&(!f.ate||vk<=f.ate)&&!d.fixasOcultas[f.id]).map(f=>{
    const ov=d.fixasOv[f.id],e=ov||f;
    return {fixa:true,ref:f,per:p.id,dd:d,ov:!!ov,
      t:{t:e.t,h:e.h||'',hf:e.hf||'',desc:e.desc||'',get ok(){return !!d.fixasOk[f.id]},set ok(v){if(v)d.fixasOk[f.id]=true;else delete d.fixasOk[f.id]}},
      apagar:()=>{apagando=f;editRef=null;render()}};
  });
  return porHora(fx.concat(d[p.id].map(t=>({t,ref:t,per:p.id,lista:d[p.id]}))));
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function conteudo(e,t){
  if(t.h)e.appendChild(el('span','hora',t.h+(t.hf?'–'+t.hf:'')));
  e.appendChild(document.createTextNode(t.t));
}
function linhaEdicao(item,cor){
  const r=item.ref,tt=item.t,semHora=false;
  const li=el('li','edita');li.style.setProperty('--c',cor);
  const f=document.createElement('form');
  const tx=el('input');tx.type='text';tx.value=tt.t;tx.maxLength=120;tx.setAttribute('aria-label','Nome da tarefa');
  const ds=el('textarea','ta');ds.rows=2;ds.maxLength=500;ds.placeholder='Descrição (opcional)';ds.value=tt.desc||'';
  const hh=el('input'),hf=el('input');
  hh.type=hf.type='time';hh.value=tt.h||'';hf.value=tt.hf||'';
  hh.setAttribute('aria-label','Horário inicial');hf.setAttribute('aria-label','Horário final');
  f.append(tx);
  if(!semHora){const hs=el('div','hrs');hs.append(hh,document.createTextNode('às'),hf);f.append(hs)}
  f.append(ds);
  let soDia=null;
  if(item.fixa||tt.mid){
    const esc=el('div','esc');
    const mk=(txt,val,chk)=>{const l=el('label');const i=el('input');i.type='radio';i.name='escopo';i.checked=chk;l.append(i,document.createTextNode(txt));esc.append(l);return i};
    mk(item.fixa?'Todos os dias':'Esta e as próximas','todos',true);soDia=mk(item.fixa?'Só neste dia':'Só esta ocorrência','dia',false);
    f.append(esc);
  }
  const bs=el('div','bts');
  const ok=el('button','','Salvar');ok.type='button';
  const no=el('button','sec','Cancelar');no.type='button';
  no.onclick=()=>{editRef=null;render()};
  bs.append(ok,no);
  if(item.ov){
    const rs=el('button','sec','Voltar ao padrão neste dia');rs.type='button';
    rs.onclick=()=>{delete item.dd.fixasOv[r.id];salvar();editRef=null;render()};
    bs.append(rs);
  }
  const er=el('div','erro');f.append(er,bs);
  const salvarEd=()=>{const v=tx.value.trim();if(!v)return;
    const h1=semHora?'':hh.value,h2=semHora?'':hf.value;
    er.textContent='';
    if(h2&&(!h1||h2<=h1)){er.textContent='O horário final precisa ser depois do inicial.';return}
    const novo={t:v,h:h1,hf:h2,desc:ds.value.trim()};
    if(item.fixa){
      if(soDia.checked){item.dd.fixasOv[r.id]=novo;salvar()}
      else{Object.assign(r,novo);delete item.dd.fixasOv[r.id];salvarFixas();salvar()}
    }else if(r.mid&&!soDia.checked){
      Object.assign(r,novo);
      const m=mensais[item.per].find(x=>x.id===r.mid);if(m)Object.assign(m,novo);
      const base=item.k||chave(dia);
      Object.keys(dados).forEach(k=>{if(k>=base)PERIODOS.forEach(p=>(dados[k][p.id]||[]).forEach(t=>{if(t.mid===r.mid&&!t.ok)Object.assign(t,novo)}))});
      salvarMensais();salvar();
    }else{Object.assign(r,novo);salvar()}
    editRef=null;render()};
  ok.onclick=salvarEd;
  tx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();salvarEd()}};
  f.onsubmit=e=>{e.preventDefault();salvarEd()};
  li.appendChild(f);
  setTimeout(()=>tx.focus(),0);
  return li;
}
function linhaApagar(item,cor){
  const f=item.ref,d=item.dd;
  const li=el('li','edita apaga');li.style.setProperty('--c',cor);
  const bs=el('div','bts');
  const fim=()=>{apagando=null;render()};
  const b=(txt,fn,cls)=>{const x=el('button',cls||'',txt);x.type='button';x.onclick=fn;bs.append(x)};
  if(item.fixa){
    b('Só neste dia',()=>{d.fixasOcultas[f.id]=true;salvar();fim()});
    b('Deste dia em diante',()=>{
      const pv=new Date(dia);pv.setDate(pv.getDate()-1);const pk=chave(pv);
      if(pk<f.desde)fixas[item.per]=fixas[item.per].filter(x=>x!==f);else f.ate=pk;
      salvarFixas();fim()});
    b('Todos os dias',()=>{fixas[item.per]=fixas[item.per].filter(x=>x!==f);salvarFixas();fim()});
  }else{
    const base=item.k||chave(dia),id=item.t.mid,per=item.per;
    const tirar=(de)=>Object.keys(dados).forEach(k=>{if(k>=de)PERIODOS.forEach(p=>{dados[k][p.id]=(dados[k][p.id]||[]).filter(t=>t.mid!==id)})});
    b('Só esta ocorrência',()=>{const i=item.lista.indexOf(item.t);if(i>-1)item.lista.splice(i,1);salvar();fim()});
    b('Esta e as próximas',()=>{
      const pv=new Date(base+'T12:00:00');pv.setDate(pv.getDate()-1);const pk=chave(pv);
      const m=mensais[per].find(x=>x.id===id);
      if(m){if(pk<m.desde)mensais[per]=mensais[per].filter(x=>x!==m);else m.ate=pk}
      tirar(base);salvarMensais();salvar();fim()});
    b('Todas',()=>{mensais[per]=mensais[per].filter(x=>x.id!==id);tirar('0000');salvarMensais();salvar();fim()});
  }
  b('Cancelar',fim,'sec');
  li.append(el('div','pergunta','Apagar “'+item.t.t+'”:'),bs);
  return li;
}
function linha(item,cor,id,rotulo){
  if(editando&&apagando&&apagando===item.ref&&(item.fixa||item.t.mid))return linhaApagar(item,cor);
  if(editando&&editRef&&editRef===item.ref)return linhaEdicao(item,cor);
  const li=el('li');li.style.setProperty('--c',cor);
  if(item.t.ok)li.className='feito';
  if(!editando){
    const cb=el('input');cb.type='checkbox';cb.checked=item.t.ok;cb.id=id;
    cb.onchange=()=>{item.t.ok=cb.checked;salvar();render()};
    const temD=!!item.t.desc,aberta=abertas.has(item.ref);
    let lb;
    if(temD){
      lb=el('span','tit');lb.tabIndex=0;lb.setAttribute('role','button');lb.setAttribute('aria-expanded',String(aberta));
      const alt=()=>{aberta?abertas.delete(item.ref):abertas.add(item.ref);render()};
      lb.onclick=alt;
      lb.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();alt()}};
    }else{lb=el('label');lb.htmlFor=id}
    conteudo(lb,item.t);
    if(temD)lb.appendChild(el('span','chev',aberta?'▾':'▸'));
    if(rotulo)lb.appendChild(el('span','origem',rotulo));
    li.append(cb,lb);
    if(temD&&aberta)li.appendChild(el('div','desc',item.t.desc));
  }else{
    const tx=el('span','txt');conteudo(tx,item.t);
    if(rotulo)tx.appendChild(el('span','origem',rotulo));
    if(item.t.desc)tx.appendChild(el('span','dsc',item.t.desc));
    const ed=el('button','','✎');ed.setAttribute('aria-label','Editar tarefa');
    ed.onclick=()=>{editRef=item.ref;render()};
    const x=el('button','','×');x.setAttribute('aria-label','Apagar tarefa');
    x.onclick=item.apagar||(item.t.mid?()=>{apagando=item.ref;editRef=null;render()}:()=>{const i=item.lista.indexOf(item.t);if(i>-1)item.lista.splice(i,1);salvar();render()});
    li.append(tx,ed,x);
  }
  return li;
}
function grupo(nome,cor,itens,prefixo,comOrigem){
  const g=el('div','grupo');g.style.setProperty('--c',cor);
  const feitas=itens.filter(i=>i.t.ok).length;
  const h=el('h2',''); h.append(el('span','nome',nome),el('span','cont',comOrigem?String(itens.length):feitas+'/'+itens.length));
  g.appendChild(h);
  const ul=document.createElement('ul');
  itens.forEach((it,i)=>{
    const rot=comOrigem?origem(it.k):(editando&&it.fixa?(it.ov?'todo dia (ajustada neste dia)':'todo dia'):(editando&&it.t.mid?'todo mês':''));
    ul.appendChild(linha(it,cor,prefixo+i,rot));
  });
  if(!itens.length)g.appendChild(el('div','vazio','Nenhuma tarefa.'));
  g.appendChild(ul);
  return g;
}
function formAdd(d){
  const w=el('section','novo');w.style.setProperty('--c','var(--dia)');
  const form=document.createElement('form');
  const inp=el('input');inp.type='text';inp.placeholder='Nova tarefa';inp.maxLength=120;inp.setAttribute('aria-label','Nova tarefa');
  const btn=el('button','','Adicionar');btn.type='button';
  form.append(inp,btn);
  const op=el('div','opcoes');
  const hh=el('input'),hf=el('input');hh.type=hf.type='time';
  hh.setAttribute('aria-label','Horário inicial (opcional)');hf.setAttribute('aria-label','Horário final (opcional)');
  const hl=el('label','rep');hl.append(document.createTextNode('Horário'),hh,document.createTextNode('às'),hf);
  const r=el('label','rep');
  const sel=el('select');sel.setAttribute('aria-label','Repetição');
  [['','Não repetir'],['dia','Todos os dias'],['mes','Todo mês']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;sel.append(o)});
  r.append(document.createTextNode('Repetir'),sel);
  const mw=el('label','rep');mw.style.display='none';
  const nd=el('input');nd.type='number';nd.min=1;nd.max=31;nd.value=dia.getDate();nd.setAttribute('aria-label','Dia do mês');
  mw.append(document.createTextNode('no dia'),nd);
  sel.onchange=()=>{mw.style.display=sel.value==='mes'?'':'none'};
  op.append(hl,r,mw);
  const ds=el('textarea','ta');ds.rows=2;ds.maxLength=500;ds.placeholder='Descrição (opcional)';
  const dica=el('div','dica','O bloco vem do horário inicial: sem horário vai para Diárias; até 11:59, Manhã; de 12:00 às 17:59, Tarde; a partir das 18:00, Noite.');
  const er=el('div','erro');
  const enviar=()=>{const v=inp.value.trim();if(!v)return;
    const h1=hh.value,h2=hf.value;
    er.textContent='';
    if(h2&&(!h1||h2<=h1)){er.textContent='O horário final precisa ser depois do inicial.';return}
    const novo={t:v,h:h1,hf:h2,desc:ds.value.trim()};
    const per=grupoDe(h1);
    const nid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(sel.value==='dia'){fixas[per].push({id:nid,desde:chave(dia),...novo});salvarFixas()}
    else if(sel.value==='mes'){
      const n=parseInt(nd.value,10);
      if(!(n>=1&&n<=31)){er.textContent='Escolha um dia do mês entre 1 e 31.';return}
      mensais[per].push({id:nid,dia:n,desde:chave(dia),...novo});salvarMensais();
    }
    else{d[per].push({ok:false,...novo});salvar()}
    render()};
  btn.onclick=enviar;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();enviar()}};
  form.onsubmit=e=>{e.preventDefault();enviar()};
  w.append(form,er,op,ds,dica);
  return w;
}
let msgBk='';
function blocoBackup(){
  const s=el('section','backup');s.appendChild(el('h2','','Cópia de segurança'));
  const bs=el('div','bts');
  const ex=el('button','','Salvar cópia');ex.type='button';
  const im=el('button','','Restaurar cópia');im.type='button';
  const fi=el('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;
  const msg=el('div','dica',msgBk||'O arquivo guarda todas as tarefas, fixas, mensais e checks. Restaurar substitui o que está no app agora.');
  ex.onclick=()=>{try{
    const blob=new Blob([JSON.stringify({v:1,dados,fixas,mensais})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='organizador-backup-'+chave(new Date())+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    msg.textContent='Cópia gerada. Guarde o arquivo baixado em um lugar seguro.';
  }catch(e){msg.textContent='Não foi possível gerar a cópia neste modo de abertura.'}};
  im.onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const j=JSON.parse(r.result);
      if(!j||typeof j.dados!=='object'||typeof j.fixas!=='object'||typeof j.mensais!=='object')throw 0;
      dados=j.dados;fixas=j.fixas;mensais=j.mensais;
      PERIODOS.forEach(p=>{if(!Array.isArray(fixas[p.id]))fixas[p.id]=[];if(!Array.isArray(mensais[p.id]))mensais[p.id]=[]});
      salvar();salvarFixas();salvarMensais();msgBk='Cópia restaurada.';render();
    }catch(e){msg.textContent='Arquivo inválido.'}};
    r.readAsText(f)};
  bs.append(ex,im);s.append(bs,msg,fi);
  return s;
}
function render(){
  document.getElementById('titulo').innerHTML=titulo();
  document.getElementById('modo').textContent=editando?'Pronto':'Editar tarefas';
  const lim=new Date(dia);lim.setDate(lim.getDate()+7);gerarMensais(chave(lim));
  document.getElementById('dp').value=chave(dia);
  const d=doDia(),box=document.getElementById('periodos');box.innerHTML='';
  const pend=pendentes();
  const todos=itensTodos(d);
  const total=todos.length,feitas=todos.filter(i=>i.t.ok).length;
  document.getElementById('barra').style.display=editando?'none':'';
  document.getElementById('prog').style.width=(total?feitas/total*100:0)+'%';

  if(editando)box.appendChild(formAdd(d));
  const lista=el('section','lista');
  if(pend.length)lista.appendChild(grupo('Pendentes','var(--pend)',pend,'pend',true));
  PERIODOS.forEach(p=>{
    const itens=porHora(todos.filter(i=>grupoDe(i.t.h)===p.id));
    if(itens.length)lista.appendChild(grupo(p.nome,p.cor,itens,p.id,false));
  });
  if(lista.children.length)box.appendChild(lista);
  else box.appendChild(el('div','livre',editando?'Nenhuma tarefa neste dia ainda.':'Nada planejado para este dia. Toque em “Editar tarefas” para adicionar.'));

  if(editando){
    const vk=chave(dia),oc=[];
    PERIODOS.forEach(p=>fixas[p.id].forEach(f=>{if(f.desde<=vk&&(!f.ate||vk<=f.ate)&&d.fixasOcultas[f.id])oc.push(f)}));
    if(oc.length){
      const w=el('section','ocultas');w.appendChild(el('h2','','Fixas ocultas neste dia'));
      const ul=document.createElement('ul');
      oc.forEach(f=>{const li=el('li');const b=el('button','','Restaurar');
        b.onclick=()=>{delete d.fixasOcultas[f.id];salvar();render()};
        li.append(el('span','',f.t),b);ul.appendChild(li)});
      w.appendChild(ul);box.appendChild(w);
    }
  }
  const av=avisos();
  const bk=editando?blocoBackup():null;
  if(av.length){
    const s=el('section','aviso');s.appendChild(el('h2','','Em breve'));
    const ul=document.createElement('ul');
    av.forEach(i=>{const li=el('li');li.append(el('span','',i.t.t),el('span','tag',i.tag));
      if(editando){const x=el('button','','×');x.setAttribute('aria-label','Apagar tarefa');
        x.onclick=()=>{const k=i.lista.indexOf(i.t);if(k>-1)i.lista.splice(k,1);salvar();render()};li.append(x)}
      ul.appendChild(li)});
    s.appendChild(ul);box.appendChild(s);
  }
  if(bk)box.appendChild(bk);
}
try{localStorage.setItem('meudia_t','1');localStorage.removeItem('meudia_t')}catch(e){document.getElementById('alerta').hidden=false}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
addEventListener('storage',e=>{if(e.key==='meudia'||e.key==='meudia_fixas'||e.key==='meudia_mensais'){carregar();render()}});
const dp=document.getElementById('dp');
dp.onclick=()=>{try{dp.showPicker()}catch(e){}};
dp.onchange=()=>{if(!dp.value)return;editRef=null;apagando=null;dia=meioDia(new Date(dp.value+'T12:00:00'));render()};
document.getElementById('ant').onclick=()=>{editRef=null;apagando=null;dia.setDate(dia.getDate()-1);render()};
document.getElementById('prox').onclick=()=>{editRef=null;apagando=null;dia.setDate(dia.getDate()+1);render()};
document.getElementById('hoje').onclick=()=>{editRef=null;apagando=null;dia=meioDia(new Date());render()};
document.getElementById('modo').onclick=()=>{editRef=null;apagando=null;editando=!editando;render()};
render();
</script>
